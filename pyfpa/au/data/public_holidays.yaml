  2026-05-04: May Day (NT); Labour Day (QLD)
  2026-06-01: Reconciliation Day (ACT); Western Australia Day
  2026-06-08: King's Birthday (excluding WA and QLD)
  2026-08-03: Picnic Day (NT)
