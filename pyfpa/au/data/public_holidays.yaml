  2026-12-31: New Year's Eve (NT, SA)
  2027-01-01: New Year's Day
  2027-01-26: Australia Day
  2027-03-01: Labour Day (WA)
  2027-03-08: Eight Hours Day (TAS); Labour Day (VIC); Adelaide Cup Day (SA); Canberra Day (ACT)
