version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # move together: a job running one release against the other's config
      # fails outright. Grouped so the pair can never arrive split.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Minor and patch action updates arrive as one pull request, so they need
      # one rebase and CI run instead of one each. Majors stay separate for review.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion. Dependabot bumps fail the POLICY pin test and add
      # unapproved SHAs to the portfolio audit, so re-pin by hand instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # pydantic exact-pins pydantic-core. Solo updates are unsatisfiable
      # (dependency_file_not_resolvable / unknown_error), so the pair must
      # move in one lock refresh. Listed before the catch-all group.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Lockfile-only pydantic-core bumps cannot resolve against pydantic's
      # exact pin. pydantic updates bring the matching core with them.
      - dependency-name: "pydantic-core"
