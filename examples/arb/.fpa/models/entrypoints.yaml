schema_version: 1
entrypoints:
- name: arb-pipeline
  kind: forecast
  description: Run ARB actual-driver reproduction, retrospective comparison, forward forecast,
    and THB/tariff sensitivity.
  command:
  - python3
  - run_arb.py
  # The outputs below are the committed ones, and the two research epochs beside
  # them already exist, so a replay without this flag stops at save_epoch with
  # FileExistsError. This is the regeneration command README.md documents; replay
  # into a scratch tree with --output-dir instead.
  - --replace-epochs
  working_directory: .
  inputs:
  - data/income_statement.csv
  - data/balance_sheet.csv
  - data/cash_flow.csv
  - data/segments.csv
  outputs:
  - output/reconciliation.md
  - output/historical-holdout.md
  - output/forecast-briefing.md
  - output/sensitivity.md
