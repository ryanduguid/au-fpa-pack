schema_version: 1
entrypoints:
- name: lumbridge-forecast
  kind: forecast
  description: Reconcile sources and generate monthly, weekly and daily cash with
    a management briefing.
  command:
  - python
  - models/generated/lumbridge.py
  working_directory: .
  inputs:
  - README.md
  - .fpa/sources/registry.yaml
  - data/xero_pl.csv
  - data/xero_bs.csv
  - data/payroll.csv
  - data/invoices.csv
  - data/payments.csv
  - data/assumptions.json
  outputs:
  - output/lumbridge.xlsx
  - output/briefing.md
- name: lumbridge-recurring-cash
  kind: cash
  description: Reconcile closed-period actuals, score the original forecast and preserve
    a revised snapshot.
  command:
  - python
  - models/generated/recurring.py
  - --output
  - output/recurring-cash
  working_directory: .
  inputs:
  - data/refresh-actuals.csv
  - data/refresh-controls.json
  - data/receipt-assumptions.csv
  outputs:
  - output/recurring-cash/review.json
- name: lumbridge-workbook
  kind: report
  description: Generate the same verified workbook and matching reports; only receipt
    delay is interactive.
  command:
  - python
  - models/generated/lumbridge.py
  working_directory: .
  inputs:
  - README.md
  - .fpa/sources/registry.yaml
  - data/xero_pl.csv
  - data/xero_bs.csv
  - data/payroll.csv
  - data/invoices.csv
  - data/payments.csv
  - data/assumptions.json
  outputs:
  - output/lumbridge.xlsx
  - output/briefing.md
